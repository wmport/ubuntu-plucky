name: ubuntu-image-single
on: workflow_dispatch
jobs:
  command:
    name: Build NanoPC-T6 Image
    runs-on: ubuntu-24.04-arm
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build u-boot for NanoPC T6
        run: /bin/bash ./das-u-boot.sh nanopc-t6-rk3588_defconfig

      - name: Build kernel
        run: /bin/bash ./build-kernel.sh arm64 2>&1|tee log1
        
      - name: Build rootfs
        run: |
            chmod +x ubuntu-image.sh
            sudo ./ubuntu-image.sh
      - name: Build disk image for NanoPC T6
        run:  |
            chmod +x disk_image.sh
            sudo ./disk_image.sh arm64 nanopc-t6 rk3588-nanopc-t6
            mv u-boot-rockchip.bin nanopc-t6-u-boot-rockchip.bin
      - name: Get current date
        id: date
        run: echo "now=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT

      - name: Get kernel version
        id: kernel
        run: |
          if [ -f kernel_version ]; then
            echo "kernel_version=$(cat kernel_version)" >> $GITHUB_OUTPUT
          else
            echo "kernel_version=7.2-rockchip" >> $GITHUB_OUTPUT
          fi
      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "NanoPC T6 Disk Image Build ${{ github.run_number }}"
          body: |
            NanoPC T6 Ванильный образ (Mainline U-Boot 2024.01 + Linux 7.2)
            Билд собран: ${{ steps.date.outputs.now }}
            Версия ядра: ${{ steps.kernel.outputs.kernel_version }}          draft: false
          prerelease: false
          files: |
            ./Ubuntu-*img.xz
            ./*.bin
            ./linux-*.deb        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
