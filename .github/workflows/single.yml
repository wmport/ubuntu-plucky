name: ubuntu-image-single
on: workflow_dispatch

jobs:
  command:
    name: Build NanoPC-T6 Image
    runs-on: ubuntu-24.04-arm
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Добавляем необходимые системные утилиты для разметки loop-дисков на хосте
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            parted \
            fdisk \
            uuid-runtime \
            xz-utils \
            udev \
            binutils
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      - name: Build u-boot for NanoPC T6
        run: /bin/bash ./das-u-boot.sh nanopc-t6-rk3588_defconfig

      - name: Build kernel
        run: /bin/bash ./build-kernel.sh arm64 2>&1|tee log1
        
      - name: Build rootfs
        run: |
            chmod +x ubuntu-image.sh
            sudo ./ubuntu-image.sh

      - name: Build disk image for NanoPC T6
        run:  |
            chmod +x disk_image.sh
            sudo ./disk_image.sh arm64 nanopc-t6 rk3588-nanopc-t6
            mv u-boot-rockchip.bin nanopc-t6-u-boot-rockchip.bin

      - name: Get current date
        id: date
        run: echo "now=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT

      - name: Get kernel version
        id: kernel
        run: |
          if [ -f kernel_version ]; then
            echo "kernel_version=$(cat kernel_version)" >> $GITHUB_OUTPUT
          else
            echo "kernel_version=7.2-rockchip" >> $GITHUB_OUTPUT
          fi

      # 2. ИСПРАВЛЕНИЕ: Выравнивание отступов параметров релиза и путей к файлам
      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "NanoPC T6 Disk Image Build ${{ github.run_number }}"
          body: |
            NanoPC T6 Ванильный образ (Mainline U-Boot 2024.01 + Linux 7.2)
            Билд собран: ${{ steps.date.outputs.now }}
            Версия ядра: ${{ steps.kernel.outputs.kernel_version }}
          draft: false
          prerelease: false
          # Ищем файлы в папке images/ и убираем прилипший env:
          files: |
            ./images/Ubuntu-*.img.xz
            ./*nanopc-t6-u-boot-rockchip.bin
            ./*.deb
          token: ${{ secrets.GITHUB_TOKEN }}
