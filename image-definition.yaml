---
name: ubuntu-rootfs
display-name: Ubuntu rootfs ARM64
revision: 2
architecture: arm64
series: resolute
class: preinstalled
rootfs:
  archive: ubuntu
  sources-list-deb822: true
  components:
    - main
    - restricted
    - universe
    - multiverse
  mirror: "http://ubuntu.com"
  pocket: updates
  seed:
    urls:
      - "https://launchpad.net"
    branch: resolute
    names:
      - minimal
customization:
  extra-packages:
    - name: "u-boot-tools"
    - name: "u-boot-menu"
    - name: "ubuntu-desktop-minimal"
    - name: "linux-firmware"
    - name: "cloud-initramfs-growroot"
    - name: "initramfs-tools"
    - name: "localechooser-data"
    - name: "squashfs-tools"
    - name: "snapd"
    - name: "apparmor"
    - name: "apparmor-utils"
    - name: "apparmor-profiles"
    - name: "sudo"
  extra-snaps:
    - name: snapd
    - name: core24
    - name: mesa-2404
artifacts:
  tar:
    architecture: arm64
